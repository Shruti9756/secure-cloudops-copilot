[project]
name = "secure-cloudops-mcp"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "mcp[cli]>=2.0.0,<3.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["I"]