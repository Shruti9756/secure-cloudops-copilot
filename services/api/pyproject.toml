[project]
name = "secure-cloudops-api"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.19.0",
    "boto3>=1.43.69",
    "botocore[crt]>=1.43.69",
    "fastapi[standard-no-fastapi-cloud-cli]>=0.141.1",
    "pgvector>=0.5.0",
    "prometheus-client>=0.26.0",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.14.2",
    "pymupdf>=1.28.2",
    "python-docx>=1.2.0",
    "redis>=8.1.0",
    "sqlalchemy>=2.0.51",
]
[tool.fastapi]
entrypoint = "app.main:app"

[dependency-groups]
dev = [
    "httpx2>=2.9.1",
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

# Live E2E tests require Docker, PostgreSQL, Redis, Ollama, and the worker.
# Keep normal local tests and GitHub Actions independent from those services.
addopts = "-ra -m \"not e2e\""
markers = [
    "e2e: live test requiring Docker Compose services and local Ollama models",
]


[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["I"]
