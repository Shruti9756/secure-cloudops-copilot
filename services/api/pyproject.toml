[project]
name = "secure-cloudops-api"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard-no-fastapi-cloud-cli]>=0.141.1",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.14.2",
    "redis>=8.1.0",
    "sqlalchemy>=2.0.51",
]
[tool.fastapi]
entrypoint = "app.main:app"

[dependency-groups]
dev = [
    "httpx2>=2.9.1",
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"


[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["I"]
