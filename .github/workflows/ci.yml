name: Continuous Integration

on:
  push:
  pull_request:
  workflow_dispatch:

# Default permissions; the manual AWS smoke job adds OIDC token permission.
permissions:
  contents: read

jobs:
  api-quality:
    name: API quality and tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/api

    # Safe placeholder configuration so test code can load settings.
    # The CI job does not connect to real AWS, PostgreSQL, Redis, or Ollama.
    env:
      DATABASE_URL: postgresql+psycopg://securecloudops:securecloudops@localhost:5432/securecloudops
      REDIS_URL: redis://localhost:6379/0
      OLLAMA_BASE_URL: http://localhost:11434

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.11.32"
          enable-cache: true

      - name: Install API dependencies from the lockfile
        run: uv sync --locked --dev

      - name: Check Python formatting
        run: uv run ruff format --check .

      - name: Lint Python
        run: uv run ruff check .

      - name: Run API tests
        run: uv run python -m pytest -q

  web-quality:
    name: Web quality and build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install frontend dependencies from the lockfile
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Build static frontend export
        env:
          WEB_OUTPUT_MODE: export
        run: |
          npm run build
          test -f out/index.html
          test -f out/auth/callback.html

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest

    steps:
      - name: Check out complete Git history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Scan for accidentally committed secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false

  terraform-quality:
    name: Terraform format and validation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false

      # Download locked providers without contacting the real AWS backends.
      - name: Initialize Terraform roots without backends
        run: |
          terraform -chdir=infra/terraform/bootstrap init -backend=false -input=false
          terraform -chdir=infra/terraform/environments/development init -backend=false -input=false
          terraform -chdir=infra/terraform/environments/staging init -backend=false -input=false
          terraform -chdir=infra/terraform/environments/staging-frontend init -backend=false -input=false
          terraform -chdir=infra/terraform/environments/github-delivery init -backend=false -input=false -lockfile=readonly

      - name: Check Terraform formatting
        run: terraform -chdir=infra/terraform fmt -check -recursive

      - name: Validate Terraform roots
        run: |
          terraform -chdir=infra/terraform/bootstrap validate -no-color
          terraform -chdir=infra/terraform/environments/development validate -no-color
          terraform -chdir=infra/terraform/environments/staging validate -no-color
          terraform -chdir=infra/terraform/environments/staging-frontend validate -no-color
          terraform -chdir=infra/terraform/environments/github-delivery validate -no-color

  aws-oidc-smoke:
    name: AWS OIDC identity smoke test
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'Shruti9756/secure-cloudops-copilot' &&
      github.ref == 'refs/heads/codex/v04-aws-platform'
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    permissions:
      contents: read
      id-token: write

    env:
      EXPECTED_AWS_ACCOUNT_ID: "291667884598"
      EXPECTED_AWS_ROLE_SESSION_NAME: GitHubOIDCSmoke-${{ github.run_id }}-${{ github.run_attempt }}
      AWS_PAGER: ""

    steps:
      - name: Obtain temporary AWS credentials through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: us-east-1
          audience: sts.amazonaws.com
          role-to-assume: arn:aws:iam::291667884598:role/secure-cloudops-github-oidc-smoke
          role-session-name: ${{ env.EXPECTED_AWS_ROLE_SESSION_NAME }}
          role-duration-seconds: 900
          allowed-account-ids: "291667884598"
          unset-current-credentials: true
          translate-env-variables: false
          output-credentials: false
          output-env-credentials: true
          action-timeout-s: 120
          retry-max-attempts: 3

      - name: Verify the temporary AWS identity
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess

          identity = json.loads(
              subprocess.check_output(
                  [
                      "aws",
                      "sts",
                      "get-caller-identity",
                      "--region",
                      "us-east-1",
                      "--output",
                      "json",
                  ],
                  text=True,
              )
          )
          expected_account = os.environ["EXPECTED_AWS_ACCOUNT_ID"]
          expected_session = os.environ["EXPECTED_AWS_ROLE_SESSION_NAME"]
          expected_arn = (
              f"arn:aws:sts::{expected_account}:assumed-role/"
              f"secure-cloudops-github-oidc-smoke/{expected_session}"
          )

          if identity.get("Account") != expected_account:
              raise SystemExit("FAIL: unexpected AWS account.")
          if identity.get("Arn") != expected_arn:
              raise SystemExit("FAIL: unexpected AWS role or session.")

          print(f"AWS account: {identity['Account']}")
          print(f"Assumed role: {identity['Arn']}")
          print("PASS: GitHub OIDC temporary AWS authentication verified.")
          PY