name: Continuous Integration

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      publish_api_image:
        description: "Publish the scanned API image to ECR (does not deploy)"
        required: true
        type: boolean
        default: false

# Only the manual AWS identity and publishing jobs request OIDC permission.
permissions:
  contents: read

jobs:
  api-quality:
    name: API quality and tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/api

    # Safe placeholder configuration so test code can load settings.
    # The CI job does not connect to real AWS, PostgreSQL, Redis, or Ollama.
    env:
      DATABASE_URL: postgresql+psycopg://securecloudops:securecloudops@localhost:5432/securecloudops
      REDIS_URL: redis://localhost:6379/0
      OLLAMA_BASE_URL: http://localhost:11434

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.11.32"
          enable-cache: true

      - name: Install API dependencies from the lockfile
        run: uv sync --locked --dev

      - name: Check Python formatting
        run: uv run ruff format --check .

      - name: Lint Python
        run: uv run ruff check .

      - name: Run API tests
        run: uv run python -m pytest -q

  web-quality:
    name: Web quality and build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install frontend dependencies from the lockfile
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Build static frontend export
        env:
          WEB_OUTPUT_MODE: export
        run: |
          npm run build
          test -f out/index.html
          test -f out/auth/callback.html

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest

    steps:
      - name: Check out complete Git history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Scan for accidentally committed secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false

  terraform-quality:
    name: Terraform format and validation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false

      # Download locked providers without contacting the real AWS backends.
      - name: Initialize Terraform roots without backends
        run: |
          terraform -chdir=infra/terraform/bootstrap init -backend=false -input=false
          terraform -chdir=infra/terraform/environments/development init -backend=false -input=false
          terraform -chdir=infra/terraform/environments/staging init -backend=false -input=false
          terraform -chdir=infra/terraform/environments/staging-frontend init -backend=false -input=false
          terraform -chdir=infra/terraform/environments/github-delivery init -backend=false -input=false -lockfile=readonly

      - name: Check Terraform formatting
        run: terraform -chdir=infra/terraform fmt -check -recursive

      - name: Validate Terraform roots
        run: |
          terraform -chdir=infra/terraform/bootstrap validate -no-color
          terraform -chdir=infra/terraform/environments/development validate -no-color
          terraform -chdir=infra/terraform/environments/staging validate -no-color
          terraform -chdir=infra/terraform/environments/staging-frontend validate -no-color
          terraform -chdir=infra/terraform/environments/github-delivery validate -no-color

  aws-oidc-smoke:
    name: AWS OIDC identity smoke test
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'Shruti9756/secure-cloudops-copilot' &&
      github.ref == 'refs/heads/codex/v04-aws-platform'
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    permissions:
      contents: read
      id-token: write

    env:
      EXPECTED_AWS_ACCOUNT_ID: "291667884598"
      EXPECTED_AWS_ROLE_SESSION_NAME: GitHubOIDCSmoke-${{ github.run_id }}-${{ github.run_attempt }}
      AWS_PAGER: ""

    steps:
      - name: Obtain temporary AWS credentials through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: us-east-1
          audience: sts.amazonaws.com
          role-to-assume: arn:aws:iam::291667884598:role/secure-cloudops-github-oidc-smoke
          role-session-name: ${{ env.EXPECTED_AWS_ROLE_SESSION_NAME }}
          role-duration-seconds: 900
          allowed-account-ids: "291667884598"
          unset-current-credentials: true
          translate-env-variables: false
          output-credentials: false
          output-env-credentials: true
          action-timeout-s: 120
          retry-max-attempts: 3

      - name: Verify the temporary AWS identity
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess

          identity = json.loads(
              subprocess.check_output(
                  [
                      "aws",
                      "sts",
                      "get-caller-identity",
                      "--region",
                      "us-east-1",
                      "--output",
                      "json",
                  ],
                  text=True,
              )
          )
          expected_account = os.environ["EXPECTED_AWS_ACCOUNT_ID"]
          expected_session = os.environ["EXPECTED_AWS_ROLE_SESSION_NAME"]
          expected_arn = (
              f"arn:aws:sts::{expected_account}:assumed-role/"
              f"secure-cloudops-github-oidc-smoke/{expected_session}"
          )

          if identity.get("Account") != expected_account:
              raise SystemExit("FAIL: unexpected AWS account.")
          if identity.get("Arn") != expected_arn:
              raise SystemExit("FAIL: unexpected AWS role or session.")

          print(f"AWS account: {identity['Account']}")
          print(f"Assumed role: {identity['Arn']}")
          print("PASS: GitHub OIDC temporary AWS authentication verified.")
          PY

  api-image-security:
    name: API image build and vulnerability scan
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'Shruti9756/secure-cloudops-copilot' &&
      github.ref == 'refs/heads/codex/v04-aws-platform'
    needs: [api-quality, secret-scan]
    outputs:
      image_archive_sha256: ${{ steps.export-image.outputs.sha256 }}
      image_artifact_id: ${{ steps.upload-image.outputs.artifact-id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    permissions:
      contents: read

    defaults:
      run:
        shell: bash

    env:
      DOCKER_BUILDKIT: "1"
      API_IMAGE: secure-cloudops-api:${{ github.sha }}

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Build the API image without pushing
        run: |
          set -euo pipefail
          docker build \
            --platform linux/amd64 \
            --file services/api/Dockerfile \
            --tag "$API_IMAGE" \
            services/api
          docker image inspect "$API_IMAGE" --format '{{.Id}}'

      - name: Install pinned Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.76.0
          cache: false

      - name: Scan OS and Python dependencies
        run: |
          set -euo pipefail
          trivy --version
          trivy image \
            --image-src docker \
            --scanners vuln \
            --pkg-types os,library \
            --severity HIGH,CRITICAL \
            --ignore-unfixed=false \
            --ignorefile /dev/null \
            --exit-code 1 \
            --timeout 10m \
            --cache-dir "$RUNNER_TEMP/trivy-cache" \
            --list-all-pkgs \
            --format json \
            --output "$RUNNER_TEMP/api-image-vulnerabilities.json" \
            "$API_IMAGE" 2>&1 | tee "$RUNNER_TEMP/api-image-scan.log"

      - name: Show the vulnerability report even when the scan fails
        if: always()
        run: |
          set -euo pipefail
          if [ -f "$RUNNER_TEMP/api-image-vulnerabilities.json" ]; then
            trivy convert \
              --format table \
              --output "$RUNNER_TEMP/api-image-vulnerabilities.txt" \
              "$RUNNER_TEMP/api-image-vulnerabilities.json"
            cat "$RUNNER_TEMP/api-image-vulnerabilities.txt"
          else
            echo "No vulnerability report was produced. Check the build/install/scan logs."
          fi

      - name: Save the scan report and diagnostic log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: api-image-security-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/api-image-vulnerabilities.json
            ${{ runner.temp }}/api-image-vulnerabilities.txt
            ${{ runner.temp }}/api-image-scan.log
          retention-days: 7
          if-no-files-found: warn

      - name: Export the scanned image only when publication is requested
        if: ${{ success() && inputs.publish_api_image }}
        id: export-image
        run: |
          set -euo pipefail
          docker save --output "$RUNNER_TEMP/api-image.tar" "$API_IMAGE"
          archive_sha256="$(sha256sum "$RUNNER_TEMP/api-image.tar" | cut -d ' ' -f 1)"
          printf 'sha256=%s\n' "$archive_sha256" >> "$GITHUB_OUTPUT"

      - name: Transfer the scanned image to the publisher job
        if: ${{ success() && inputs.publish_api_image }}
        id: upload-image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: api-image-for-publish-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/api-image.tar
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  api-image-publish:
    name: Publish scanned API image to ECR
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'Shruti9756/secure-cloudops-copilot' &&
      github.ref == 'refs/heads/codex/v04-aws-platform' &&
      inputs.publish_api_image
    needs: [api-image-security, web-quality, terraform-quality, aws-oidc-smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: api-image-publish-${{ github.sha }}
      cancel-in-progress: false

    permissions:
      contents: read
      id-token: write

    defaults:
      run:
        shell: bash

    env:
      API_IMAGE: secure-cloudops-api:${{ github.sha }}
      ECR_REGISTRY: 291667884598.dkr.ecr.us-east-1.amazonaws.com
      ECR_REPOSITORY: secure-cloudops-staging/api
      EXPECTED_AWS_ACCOUNT_ID: "291667884598"
      EXPECTED_AWS_ROLE_SESSION_NAME: GitHubAPIPublish-${{ github.run_id }}-${{ github.run_attempt }}
      EXPECTED_ARCHIVE_SHA256: ${{ needs.api-image-security.outputs.image_archive_sha256 }}
      AWS_REGION: us-east-1
      AWS_PAGER: ""

    steps:
      - name: Download this run's scanned image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.api-image-security.outputs.image_artifact_id }}
          path: ${{ runner.temp }}/scanned-api-image
          digest-mismatch: error

      - name: Verify the archive and load it without rebuilding
        run: |
          set -euo pipefail
          [[ "$EXPECTED_ARCHIVE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          archive="$RUNNER_TEMP/scanned-api-image/api-image.tar"
          printf '%s  %s\n' "$EXPECTED_ARCHIVE_SHA256" "$archive" | sha256sum --check -
          docker load --input "$archive"
          platform="$(docker image inspect "$API_IMAGE" --format '{{.Os}}/{{.Architecture}}')"
          test "$platform" = "linux/amd64"
          echo "PASS: verified and loaded the scanned linux/amd64 image."

      - name: Obtain temporary publisher credentials through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: us-east-1
          audience: sts.amazonaws.com
          role-to-assume: arn:aws:iam::291667884598:role/secure-cloudops-github-api-image-publisher
          role-session-name: ${{ env.EXPECTED_AWS_ROLE_SESSION_NAME }}
          role-duration-seconds: 900
          allowed-account-ids: "291667884598"
          unset-current-credentials: true
          translate-env-variables: false
          output-credentials: false
          output-env-credentials: true
          action-timeout-s: 120
          retry-max-attempts: 3

      - name: Verify the publisher identity
        run: |
          set -euo pipefail
          account="$(aws sts get-caller-identity --query Account --output text)"
          arn="$(aws sts get-caller-identity --query Arn --output text)"
          expected_arn="arn:aws:sts::${EXPECTED_AWS_ACCOUNT_ID}:assumed-role/secure-cloudops-github-api-image-publisher/${EXPECTED_AWS_ROLE_SESSION_NAME}"
          test "$account" = "$EXPECTED_AWS_ACCOUNT_ID"
          test "$arn" = "$expected_arn"
          printf 'PASS: publisher identity verified: %s\n' "$arn"

      - name: Push the scanned image and verify its ECR digest
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/docker-ecr
        run: |
          set -euo pipefail
          image_uri="$ECR_REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA"
          trap 'docker logout "$ECR_REGISTRY" >/dev/null 2>&1 || true' EXIT

          aws ecr get-login-password --region "$AWS_REGION" |
            docker login --username AWS --password-stdin "$ECR_REGISTRY"

          docker tag "$API_IMAGE" "$image_uri"
          docker push "$image_uri" 2>&1 | tee "$RUNNER_TEMP/api-image-push.log"

          push_digest="$(sed -nE 's/^.*digest: (sha256:[0-9a-f]{64}) size:.*$/\1/p' "$RUNNER_TEMP/api-image-push.log" | tail -n 1)"
          [[ "$push_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          ecr_digest="$(aws ecr describe-images \
            --registry-id "$EXPECTED_AWS_ACCOUNT_ID" \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids "imageTag=$GITHUB_SHA" \
            --region "$AWS_REGION" \
            --query 'imageDetails[0].imageDigest' \
            --output text)"
          test "$ecr_digest" = "$push_digest"

          printf 'PASS: ECR digest verified: %s\n' "$ecr_digest"
          {
            echo '### API image publication'
            printf -- '- Commit: `%s`\n' "$GITHUB_SHA"
            printf -- '- Image: `%s@%s`\n' "$ECR_REGISTRY/$ECR_REPOSITORY" "$ecr_digest"
            echo '- Published the scanned image; no application deployment was performed.'
          } >> "$GITHUB_STEP_SUMMARY"