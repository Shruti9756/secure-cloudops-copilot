name: secure-cloudops

services:
  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    environment:
      APP_ENV: development
      IDENTITY_PROVIDER: ${IDENTITY_PROVIDER:-local}
      COGNITO_ISSUER: ${COGNITO_ISSUER:-}
      COGNITO_APP_CLIENT_ID: ${COGNITO_APP_CLIENT_ID:-}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      # Containers use Docker's internal DNS, not 127.0.0.1.
      OLLAMA_BASE_URL: http://ollama:11434
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  prometheus:
    # Pin a known Prometheus release instead of using a floating latest tag.
    image: prom/prometheus:v3.12.0
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      # Keep local monitoring data bounded; dashboards do not need unlimited history.
      - "--storage.tsdb.retention.time=7d"
    ports:
      # Prometheus has no authentication in this local setup, so never expose it publicly.
      - "127.0.0.1:9090:9090"
    volumes:
      # Configuration is source-controlled and mounted read-only.
      - ./infra/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # Metrics survive ordinary container restarts.
      - prometheus_data:/prometheus
    depends_on:
      api:
        condition: service_healthy

  grafana:
    # Pin an official Grafana OSS-capable image release.
    image: grafana/grafana:13.1.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      # This project uses Grafana's built-in Prometheus source only.
      # Avoid unnecessary plugin downloads and background update attempts.
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_PLUGINS_PREINSTALL_AUTO_UPDATE: "false"
    ports:
      # Next.js already uses port 3000, so Grafana uses 3001 on this laptop only.
      - "127.0.0.1:3001:3000"
    volumes:
      - ./infra/observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./infra/observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_started
    restart: unless-stopped

  worker:
    # Reuse the API image because the worker uses the same RAG services and locked dependencies.
    build:
      context: ./services/api
      dockerfile: Dockerfile
    command: ["python", "-m", "app.worker"]
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      OLLAMA_BASE_URL: http://ollama:11434
      DOCUMENT_PROCESSOR_TENANT_SLUG: nimbuscart
      DOCUMENT_PROCESSOR_POLL_INTERVAL_SECONDS: 5
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
    # The shared API Dockerfile checks port 8000; a worker intentionally exposes no HTTP port.
    healthcheck:
      disable: true
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:0.8.2-pg17-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    image: redis:8.8.1-alpine3.23
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  ollama:
    # Local embedding runtime for development; production will use AWS Bedrock.
    image: ollama/ollama:0.32.5
    ports:
      # Bind only to this laptop, never expose the local model server publicly.
      - "127.0.0.1:11434:11434"
    volumes:
      # Persist downloaded models across container restarts.
      - ollama_data:/root/.ollama
    healthcheck:
      # This succeeds only after the Ollama server is ready to accept local requests.
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
  redis_data:
  ollama_data:
  prometheus_data:
  grafana_data: