name: secure-cloudops

services:
  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      # Containers use Docker's internal DNS, not 127.0.0.1.
      OLLAMA_BASE_URL: http://ollama:11434
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    # Reuse the API image because the worker uses the same RAG services and locked dependencies.
    build:
      context: ./services/api
      dockerfile: Dockerfile
    command: ["python", "-m", "app.worker"]
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      OLLAMA_BASE_URL: http://ollama:11434
      DOCUMENT_PROCESSOR_TENANT_SLUG: nimbuscart
      DOCUMENT_PROCESSOR_POLL_INTERVAL_SECONDS: 5
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
    # The shared API Dockerfile checks port 8000; a worker intentionally exposes no HTTP port.
    healthcheck:
      disable: true
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:0.8.2-pg17-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    image: redis:8.8.1-alpine3.23
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  ollama:
    # Local embedding runtime for development; production will use AWS Bedrock.
    image: ollama/ollama:0.32.5
    ports:
      # Bind only to this laptop, never expose the local model server publicly.
      - "127.0.0.1:11434:11434"
    volumes:
      # Persist downloaded models across container restarts.
      - ollama_data:/root/.ollama
    healthcheck:
      # This succeeds only after the Ollama server is ready to accept local requests.
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
  redis_data:
  ollama_data: