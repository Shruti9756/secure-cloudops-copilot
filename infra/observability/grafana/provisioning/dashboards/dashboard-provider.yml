apiVersion: 1

providers:
  - name: secure-cloudops
    orgId: 1
    folder: SecureCloudOps
    folderUid: secure-cloudops
    type: file
    disableDeletion: true
    editable: false
    # Poll instead of relying on Windows bind-mount file-watch events.
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards